# Local full-screen chat client, served from a subdomain of accessmatch so
# that its token request to https://accessmatch.ddev.site/api/agent-token is
# same-site and carries the Drupal session cookie. Mirrors production's
# qa.access-ci.org, where one origin serves the client and proxies /api/* to
# the agent.
#
# Expects the agent on the host at port 8000 and the Next dev server
# (chatbot-fullscreen-client, `pnpm dev`) on the host at port 3000.

server {
    server_name chat.accessmatch.ddev.site;

    listen 80;
    listen 443 ssl;

    ssl_certificate /etc/ssl/certs/master.crt;
    ssl_certificate_key /etc/ssl/certs/master.key;

    error_log /dev/stdout info;
    access_log /var/log/nginx/access.log;

    location /api/ {
        proxy_pass http://host.docker.internal:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Agent runs stream over SSE.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://host.docker.internal:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Next dev's hot reload uses a websocket.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
