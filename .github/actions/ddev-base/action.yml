name: 'DDEV Base Setup'
description: 'Setup DDEV environment with database import'
author: 'connectci-platform'

inputs:
  site:
    description: 'Site identifier (e.g. accessmatch, ccmnet)'
    required: true
  database:
    description: 'Custom database URL (optional)'
    required: false
  github_token:
    description: 'GitHub token for authentication'
    required: true
  amp_uid:
    description: 'AMP UID for user authentication'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Setup DDEV
      shell: bash
      run: |
        echo 'docker compose --compatibility "$@"' > /usr/local/bin/docker-compose
        chmod +x /usr/local/bin/docker-compose
        echo ">>> Installing DDEV..."
        curl -fsSL https://apt.fury.io/drud/gpg.key | gpg --dearmor | sudo tee /etc/apt/trusted.gpg.d/ddev.gpg > /dev/null
        echo "deb [signed-by=/etc/apt/trusted.gpg.d/ddev.gpg] https://apt.fury.io/drud/ * *" | sudo tee /etc/apt/sources.list.d/ddev.list
        sudo apt-get update && sudo apt-get install -y ddev
        ddev config global --instrumentation-opt-in=false
        ddev --version
        mkcert -install

    - name: Validate composer files
      shell: bash
      run: composer validate --no-check-all

    - name: Configure and start DDEV
      shell: bash
      run: |
        ddev config --project-type=drupal10 --docroot=web --database=mysql:8.0 --php-version=8.3
        # Add additional hostnames for all test domains (DDEV will automatically append .ddev.site)
        ddev config --additional-hostnames=accessmatch,ccmnet,connectci,crct,campuschampions,coco,greatplains,kyct,nect,ondemand,pasciencedmz
        # Signal CI to the web container so settings.php skips development.services.yml,
        # keeping Twig theme-debug OFF in CI (debug output corrupts AJAX JSON responses;
        # see web/sites/default/settings.php case 'local'). Only this throwaway CI
        # checkout sets CI; local dev never does, so it keeps debug ON.
        ddev config --web-environment-add="CI=true"
        ddev start

    - name: Setup GitHub authentication for DDEV
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
      run: |
        echo "$GITHUB_TOKEN" | ddev exec gh auth login --with-token
        ddev exec composer config -g github-oauth.github.com $GITHUB_TOKEN

    - name: Install dependencies in DDEV
      shell: bash
      run: ddev composer install --optimize-autoloader

    - name: Download database
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        DATABASE: ${{ inputs.database }}
      run: |
        mkdir -p backups
        if [ -n "$DATABASE" ]; then
          echo "Downloading custom database: $DATABASE"
          wget -O backups/site.sql.gz "$DATABASE"
        else
          echo "Using existing backup file (should already exist from previous step)"
          if [ -f "backups/site.sql.gz" ]; then
            echo "✅ Found existing backup file: backups/site.sql.gz"
          else
            echo "❌ No backup file found - this action requires a database file"
            exit 1
          fi
        fi

    - name: Import database and deploy
      shell: bash
      env:
        AMP_UID: ${{ inputs.amp_uid }}
      run: |
        # Drupal import database.
        vendor/bin/robo did

    - name: Verify Twig theme-debug is OFF in CI
      shell: bash
      run: |
        # Guards against a silent no-op: if CI=true did not reach the web
        # container, settings.php would still load development.services.yml and
        # theme-debug would stay ON, corrupting AJAX responses (the very bug this
        # guards). First confirm the signal reached FPM, then confirm rendered
        # output carries no THEME DEBUG comments.
        ddev exec printenv CI | grep -qx "true" \
          || { echo "::error::CI env var did not reach the ddev web container — theme-debug may still be on"; exit 1; }
        if curl -fsSL "https://accessmatch.ddev.site/" | grep -q "THEME DEBUG"; then
          echo "::error::Twig theme-debug is ON in CI (rendered HTML contains THEME DEBUG). development.services.yml was not skipped."
          exit 1
        fi
        echo "Twig theme-debug confirmed OFF in CI."

    - name: Rebuild CI Links search index
      shell: bash
      run: ddev drush search-api:index ci_links 2>/dev/null || true

    - name: Clear watchdog logs
      shell: bash
      run: ddev drush watchdog:delete all -y

branding:
  icon: 'database'
  color: 'blue'
