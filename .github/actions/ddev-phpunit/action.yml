name: 'DDEV PHPUnit Test'
description: 'Run PHPUnit tests using DDEV'
author: 'connectci-platform'

inputs:
  shard_name:
    description: >-
      Name of this matrix shard. Names the uploaded list of test files, which the
      PHPUnit gate uses to check that every test file is in exactly one shard.
    required: true
  paths:
    description: >-
      Space-separated directories or files for this matrix shard (relative to
      repo root). Every runnable test file under them is run. When shard_dir is
      set, this is ignored and the target files come from shard_dir instead.
    required: false
    default: ''
  exclude:
    description: >-
      Space-separated directories to leave out of `paths`, for test files that
      another shard runs. Ignored when shard_dir is set.
    required: false
    default: ''
  coverage_root:
    description: >-
      Directory whose test files must all be covered by some shard. Each shard
      uploads the full list under it so the PHPUnit gate can compare it with the
      files the shards actually ran.
    required: false
    default: 'web/modules/custom'
  shard_dir:
    description: >-
      A directory of *Test.php files to shard by round-robin position. When set,
      the action lists the test files under it (recursively, excluding abstract
      base classes), sorts them deterministically, and runs only those whose
      0-based position modulo shard_total equals shard_index. New files in the
      directory auto-enroll into a shard — there is no filename list to rot. Leave blank to use `paths` instead.
    required: false
    default: ''
  shard_index:
    description: '0-based index of this shard within shard_dir (requires shard_dir).'
    required: false
    default: ''
  shard_total:
    description: 'Total number of shards splitting shard_dir (requires shard_dir).'
    required: false
    default: ''
  database:
    description: 'Custom database URL (optional)'
    required: false
  database_branch:
    description: 'Branch to download database artifact from'
    required: false
    default: 'main'
  github_token:
    description: 'GitHub token for authentication'
    required: true
  amp_uid:
    description: 'AMP UID for user authentication'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Download database backup
      if: inputs.database == ''
      uses: dawidd6/action-download-artifact@v20
      with:
        name: amp-daily-backup
        path: backups/
        workflow: backupdb.yml
        branch: ${{ inputs.database_branch }}

    - name: Setup DDEV Base
      uses: ./.github/actions/ddev-base
      with:
        site: 'accessmatch'
        database: ${{ inputs.database }}
        github_token: ${{ inputs.github_token }}
        amp_uid: ${{ inputs.amp_uid }}

    - name: Ensure web/profiles directory exists
      shell: bash
      run: |
        # Drupal phpunit bootstrap calls RecursiveDirectoryIterator on
        # web/profiles. The directory is .gitignored (web/profiles/contrib/)
        # so it may not exist on a fresh checkout. Create it empty.
        mkdir -p web/profiles

    - name: Resolve shard target files
      shell: bash
      run: |
        # Resolves this shard to an explicit list of test files, one per line,
        # in .phpunit-ci/targets.txt. Two ways to target tests:
        #  * paths      — directories or files, minus `exclude`. Used by the
        #                 "other-modules" shard, which takes every custom module
        #                 except the access_events kernel tests.
        #  * shard_dir  — a directory sharded by round-robin file position. The
        #                 action lists the test files under it, sorts them, and
        #                 keeps only those at position i where
        #                 i % shard_total == shard_index. This is what splits the
        #                 large access_events kernel suite across the events shards.
        #
        # Both use .github/scripts/phpunit-list-tests.sh, so "a test file" means
        # the same thing here and in the gate's coverage check.
        #
        # Round-robin position (not first-letter, not a hand-written file list) is
        # deliberate: a NEW test file added to the directory auto-enrolls into
        # exactly one shard, so coverage can never silently drop; and the split
        # stays balanced no matter how class names cluster (21 of the events
        # classes start with "Event", which would wreck an alphabetical split).
        mkdir -p .phpunit-ci
        list=.phpunit-ci/targets.txt
        if [ -n "${{ inputs.shard_dir }}" ]; then
          dir="${{ inputs.shard_dir }}"
          idx="${{ inputs.shard_index }}"
          total="${{ inputs.shard_total }}"
          if [ -z "$idx" ] || [ -z "$total" ]; then
            echo "::error::shard_dir requires shard_index and shard_total."
            exit 1
          fi
          all=$(bash .github/scripts/phpunit-list-tests.sh "$dir")
          total_count=$(printf '%s\n' "$all" | grep -c . || true)
          if [ "$total_count" -eq 0 ]; then
            echo "::error::No test files found under '$dir' — nothing to shard."
            exit 1
          fi
          # Keep line n iff (n-1) % total == idx.
          printf '%s\n' "$all" | awk -v total="$total" -v idx="$idx" '((NR-1)%total)==idx' > "$list"
          echo "Shard $idx/$total selected $(grep -c . "$list" || true) of $total_count files under $dir."
        else
          if [ -z "${{ inputs.paths }}" ]; then
            echo "::error::Neither paths nor shard_dir was provided."
            exit 1
          fi
          excludes=()
          for e in ${{ inputs.exclude }}; do
            excludes+=(--exclude "$e")
          done
          bash .github/scripts/phpunit-list-tests.sh ${{ inputs.paths }} ${excludes[@]+"${excludes[@]}"} > "$list"
        fi
        count=$(grep -c . "$list" || true)
        if [ "$count" -eq 0 ]; then
          # Zero files means shard_total exceeds the file count, a bad path, or
          # an exclude that swallowed everything. Fail loud rather than report a
          # green shard that ran nothing.
          echo "::error::Shard resolved to 0 test files."
          exit 1
        fi
        echo "Running $count test files:"
        sed 's/^/  /' "$list"

        # The full list for the gate's coverage check. Built here rather than in
        # the gate because the gate has no composer install, so modules that
        # come from their own repos (access, operations_cider, ...) are missing
        # there.
        bash .github/scripts/phpunit-list-tests.sh "${{ inputs.coverage_root }}" > .phpunit-ci/all.txt

    - name: Upload shard target list
      uses: actions/upload-artifact@v7.0.2
      with:
        name: phpunit-targets-${{ inputs.shard_name }}
        path: |
          .phpunit-ci/targets.txt
          .phpunit-ci/all.txt
        if-no-files-found: error
        retention-days: 7

    - name: Run PHPUnit tests
      shell: bash
      run: |
        # Runs this shard's test files (resolved above) through a generated
        # config. PHPUnit 9 runs only the FIRST path given on the command line
        # and drops the rest without a warning, so `phpunit a/ b/ c/` is not an
        # option: it once left 13 of 14 modules and all but one file per events
        # shard unrun while the job stayed green. The generated config is core's
        # phpunit.xml.dist with its suites replaced by one "shard" suite listing
        # every target file.
        #
        # The config path passed to -c MUST be absolute: kernel tests run in a
        # separate process that reloads the config from a different directory.
        #
        # The JUnit log is the source of truth for pass/fail, NOT phpunit's exit
        # code: some passing suites still exit non-zero on a Drupal deprecation
        # notice (e.g. installSchema()), which would otherwise turn a green run
        # red. We capture the exit code, then fail the step if the JUnit XML
        # records failures or errors, OR if any target file did not run.
        #
        # --log-junit MUST be an ABSOLUTE path: with `-c web/core`, phpunit's
        # relative-path base is not the repo root, so a relative log path is
        # silently written somewhere the outer shell can't find (or not at all).
        list=.phpunit-ci/targets.txt
        junit="/tmp/phpunit-results.xml"
        ddev exec "php .github/scripts/phpunit-shard-config.php \
          web/core/phpunit.xml.dist web/core/phpunit.ci-shard.xml $list"
        ddev exec "SIMPLETEST_DB=mysql://db:db@db/db phpunit \
          -c \$PWD/web/core/phpunit.ci-shard.xml \
          --testsuite shard \
          --testdox \
          --log-junit $junit" && phpunit_rc=0 || phpunit_rc=$?
        echo "phpunit exited with $phpunit_rc"

        # ddev exec runs in the container; copy the log out to the runner.
        ddev exec "cat $junit" > phpunit-results.xml 2>/dev/null || true
        if [ ! -s phpunit-results.xml ]; then
          echo "::error::No JUnit results file was produced — the run did not complete."
          exit 1
        fi
        # failures= and errors= are summed across all <testsuite> entries; a
        # child suite's failures roll up but summing them all still counts each
        # actual failure at least once, so any real failure yields a positive sum.
        fails=$(grep -oE 'failures="[0-9]+"' phpunit-results.xml | grep -oE '[0-9]+' | awk '{s+=$1} END{print s+0}')
        errs=$(grep -oE 'errors="[0-9]+"' phpunit-results.xml | grep -oE '[0-9]+' | awk '{s+=$1} END{print s+0}')
        # Count executed test methods by counting <testcase> elements: phpunit
        # emits exactly one per method run, with or without a rollup suite.
        tests=$(grep -oE '<testcase\b' phpunit-results.xml | wc -l | tr -d ' ')
        echo "JUnit totals — tests: $tests, failures: $fails, errors: $errs"

        # Every target file must show up in the JUnit log as a class suite. A
        # file that is missing did not run: its class failed to load, it has no
        # test methods, or discovery dropped it. Comparing files, not a count,
        # catches a partial run, which a zero-test check cannot.
        grep -oE '<testsuite [^>]*file="[^"]+"' phpunit-results.xml \
          | sed -E 's/.*file="([^"]+)".*/\1/; s#^/var/www/html/##' \
          | LC_ALL=C sort -u > .phpunit-ci/ran.txt || true
        missing=$(LC_ALL=C comm -23 "$list" .phpunit-ci/ran.txt)
        expected=$(grep -c . "$list" || true)
        ran=$(LC_ALL=C comm -12 "$list" .phpunit-ci/ran.txt | grep -c . || true)
        echo "Test files run: $ran of $expected"
        if [ -n "$missing" ]; then
          echo "::error::$((expected - ran)) of $expected test files did not run. Missing:"
          printf '%s\n' "$missing" | sed 's/^/  /'
          exit 1
        fi
        if [ "$fails" -gt 0 ] || [ "$errs" -gt 0 ]; then
          echo "::error::PHPUnit reported $fails failure(s) and $errs error(s)."
          exit 1
        fi
        echo "Shard passed: $tests tests in $ran files, 0 failures, 0 errors (phpunit exit $phpunit_rc ignored)."

    - name: Show test results
      if: always()
      shell: bash
      run: |
        echo "PHPUnit test run finished. Check the output above for the final result line."
