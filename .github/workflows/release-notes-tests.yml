name: (M) Release notes tests
on:
  pull_request:
    paths:
      - '.github/scripts/release-notes/**'
      - '.github/release-programs.json'
permissions:
  contents: read

# A new push to a PR cancels that PR's in-progress run.
concurrency:
  group: release-notes-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Release notes tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Run PHPUnit
        run: |
          curl -sSfL https://phar.phpunit.de/phpunit-9.6.phar -o phpunit.phar
          php phpunit.phar -c .github/scripts/release-notes/phpunit.xml
