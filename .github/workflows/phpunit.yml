name: (M) PHPUnit Tests
on:
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      database:
        description: 'Recent database dump to use (leave blank to use artifact)'
      database_branch:
        description: 'Branch to download database artifact from (default: main)'
        default: 'main'

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  phpunit:
    # Sharded so no single job exceeds the Cypress wall-clock. access_events is
    # ~20 min of kernel tests on its own (measured), so it is split into three
    # shards by file; every other custom module runs fast and shares one shard.
    # Balance is by measured weight, not per-module — rebalance the file lists
    # here if a shard drifts over ~15 min.
    name: PHPUnit (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: other-modules
            # Everything except access_events. Fast; one shard covers all of it.
            paths: >-
              web/modules/custom/access/modules/access_affinitygroup/tests/
              web/modules/custom/access/modules/access_content_api/tests/
              web/modules/custom/access/modules/access_misc/tests/
              web/modules/custom/access/modules/user_profiles/tests/
              web/modules/custom/access/tests/
              web/modules/custom/campuschampions/tests/
              web/modules/custom/connectci_llms/tests/
              web/modules/custom/domain_menu_system_block/tests/
              web/modules/custom/expandable_text/tests/
              web/modules/custom/ood_software/tests/
              web/modules/custom/operations_cider/tests/
          - name: events-1
            # access_events shard 1 — heavy EventCrud create/update/delete + previews.
            paths: >-
              web/modules/custom/access/modules/access_events/tests/src/Kernel/EventCrudCreateTest.php
              web/modules/custom/access/modules/access_events/tests/src/Kernel/EventCrudUpdateTest.php
              web/modules/custom/access/modules/access_events/tests/src/Kernel/EventCrudDeleteTest.php
              web/modules/custom/access/modules/access_events/tests/src/Kernel/EventCrudPreviewTest.php
              web/modules/custom/access/modules/access_events/tests/src/Kernel/PreviewValidatorTest.php
              web/modules/custom/access/modules/access_events/tests/src/Kernel/EventCrudSendForReviewTest.php
              web/modules/custom/access/modules/access_events/tests/src/Kernel/EventCrudRestoreTest.php
              web/modules/custom/access/modules/access_events/tests/src/Kernel/DomainGuardTest.php
              web/modules/custom/access/modules/access_events/tests/src/Kernel/EventStateMigrationTest.php
              web/modules/custom/access/modules/access_events/tests/src/Kernel/EventDetailApiControllerTest.php
              web/modules/custom/access/modules/access_events/tests/src/Kernel/EventRouteAccessTest.php
              web/modules/custom/access/modules/access_events/tests/src/Kernel/RegistrationApiTest.php
          - name: events-2
            # access_events shard 2 — occurrence edit/cancel/restore + guards.
            paths: >-
              web/modules/custom/access/modules/access_events/tests/src/Kernel/EventCrudOccurrenceEditTest.php
              web/modules/custom/access/modules/access_events/tests/src/Kernel/EventCrudCancelOccurrenceTest.php
              web/modules/custom/access/modules/access_events/tests/src/Kernel/EventCrudRestoreOccurrenceTest.php
              web/modules/custom/access/modules/access_events/tests/src/Kernel/FormWarningsTest.php
              web/modules/custom/access/modules/access_events/tests/src/Kernel/EventDeleteGuardTest.php
              web/modules/custom/access/modules/access_events/tests/src/Kernel/EventDeleteGuardFormAlterTest.php
              web/modules/custom/access/modules/access_events/tests/src/Kernel/EventDeleteGuardHooksTest.php
              web/modules/custom/access/modules/access_events/tests/src/Kernel/InstanceReactionsTest.php
              web/modules/custom/access/modules/access_events/tests/src/Kernel/SeriesReactionsTest.php
              web/modules/custom/access/modules/access_events/tests/src/Kernel/InstanceBirthStateTest.php
              web/modules/custom/access/modules/access_events/tests/src/Kernel/ModificationEmailGateTest.php
          - name: events-3
            # access_events shard 3 — notifications, state, registration, misc.
            paths: >-
              web/modules/custom/access/modules/access_events/tests/src/Kernel/CancellationNotifierTest.php
              web/modules/custom/access/modules/access_events/tests/src/Kernel/EventNotificationSupersedeTest.php
              web/modules/custom/access/modules/access_events/tests/src/Kernel/EventAccessHelperTest.php
              web/modules/custom/access/modules/access_events/tests/src/Kernel/EventDetailHttpCacheTest.php
              web/modules/custom/access/modules/access_events/tests/src/Kernel/EventDetailPublishedGateTest.php
              web/modules/custom/access/modules/access_events/tests/src/Kernel/EventSeriesPresaveBackstopTest.php
              web/modules/custom/access/modules/access_events/tests/src/Kernel/EventSeriesRescheduleBlockTest.php
              web/modules/custom/access/modules/access_events/tests/src/Kernel/IndividuallyCancelledFieldTest.php
              web/modules/custom/access/modules/access_events/tests/src/Kernel/PastPreservingRebuildTest.php
              web/modules/custom/access/modules/access_events/tests/src/Kernel/RegistrantCounterTest.php
              web/modules/custom/access/modules/access_events/tests/src/Kernel/RegistrationStateTest.php
              web/modules/custom/access/modules/access_events/tests/src/Kernel/StateChangeCollectorTest.php
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: ./.github/actions/ddev-phpunit
        with:
          paths: ${{ matrix.paths }}
          database: ${{ github.event.inputs.database }}
          database_branch: ${{ github.event.inputs.database_branch }}
          github_token: ${{ secrets.GH_TOKEN_REPO }}
          amp_uid: ${{ secrets.AMP_UID }}
