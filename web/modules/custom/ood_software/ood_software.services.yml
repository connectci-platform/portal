services:
  ood_software.gh:
    class: Drupal\ood_software\Plugin\GitHubService
    arguments: ['@http_client', '@key.repository', '@messenger', '@logger.factory', '@entity_type.manager']

  ood_software.flag_cache_invalidator:
    class: Drupal\ood_software\EventSubscriber\FlagCacheInvalidator
    arguments: ['@cache_tags.invalidator']
    tags:
      - { name: event_subscriber }

  ood_software.jsonapi_cache_subscriber:
    class: Drupal\ood_software\EventSubscriber\JsonApiCacheSubscriber
    arguments: ['@current_user']
    tags:
      - { name: event_subscriber }

  ood_software.doc_sync:
    class: Drupal\ood_software\Service\DocSyncService
    arguments: ['@http_client', '@entity_type.manager', '@logger.factory']

  ood_software.appverse_logo_url:
    class: Drupal\ood_software\Service\AppverseLogoUrl
    arguments: ['@file_url_generator']

  ood_software.appverse_cache:
    class: Drupal\ood_software\Service\AppverseCacheService
    arguments: ['@entity_type.manager', '@file_url_generator', '@file_system', '@logger.factory', '@ood_software.appverse_logo_url']

  ood_software.repo_member_apps:
    class: Drupal\ood_software\Service\RepoMemberApps
    arguments: ['@entity_type.manager']

  ood_software.appverse_cache_flush:
    class: Drupal\ood_software\EventSubscriber\AppverseCacheFlushSubscriber
    arguments: ['@ood_software.appverse_cache']
    tags:
      - { name: event_subscriber }

  ood_software.repo_sync:
    class: Drupal\ood_software\Service\RepoSyncService
    arguments: ['@entity_type.manager', '@logger.factory', '@datetime.time', '@ood_software.gh']

  ood_software.review_dispatcher:
    class: Drupal\ood_software\Service\AppverseReviewService
    arguments: ['@http_client', '@key.repository', '@logger.factory', '@entity_type.manager', '@datetime.time', '@file_system', '@ood_software.review_seeder', '@current_user']

  ood_software.review_seeder:
    class: Drupal\ood_software\Service\AppverseReviewSeeder
    arguments: ['@entity_type.manager', '@file.repository', '@file_system', '@logger.factory']

  ood_software.repo_notifier:
    class: Drupal\ood_software\Service\RepoNotificationService
    arguments:
      - '@plugin.manager.mail'
      - '@entity_type.manager'
      - '@logger.factory'

  ood_software.legacy_app_add_redirect:
    class: Drupal\ood_software\EventSubscriber\LegacyAppAddRedirectSubscriber
    arguments: ['@messenger', '@current_user']
    tags:
      - { name: event_subscriber }

  # Appverse reviewers may view the latest version of a repo, app or review
  # (appverse-planning#36). The route subscriber swaps the node latest-version
  # route's requirement onto this check, which runs the site's own check
  # (access_check.latest_revision, as access_events decorates it) and adds
  # the reviewer allowance.
  ood_software.latest_version_access:
    class: Drupal\ood_software\Access\AppverseLatestVersionAccessCheck
    arguments: ['@access_check.latest_revision', '@content_moderation.moderation_information']
    tags:
      - { name: access_check, applies_to: _ood_software_latest_version }
  ood_software.latest_version_route_subscriber:
    class: Drupal\ood_software\Routing\AppverseLatestVersionRouteSubscriber
    tags:
      - { name: event_subscriber }

  # Re-reviews a listed repo on a new GitHub release (appverse-planning#34).
  ood_software.release_watcher:
    class: Drupal\ood_software\Service\ReleaseWatcher
    arguments: ['@entity_type.manager', '@ood_software.review_dispatcher', '@logger.factory']
  # Who reviews a repo (appverse-planning#33).
  ood_software.review_assignment:
    class: Drupal\ood_software\Service\ReviewAssignment
    arguments: ['@entity_type.manager', '@current_user', '@logger.factory']
  # A repo's progress line facts, for the hub card and the review page
  # (appverse-planning#31).
  ood_software.repo_progress:
    class: Drupal\ood_software\Service\RepoProgress
    arguments: ['@entity_type.manager']
  # Carries out a review's decision on the review, its repo and its apps
  # (appverse-planning#29, #30, #32).
  ood_software.review_decision_applier:
    class: Drupal\ood_software\Service\ReviewDecisionApplier
    arguments: ['@entity_type.manager', '@current_user', '@datetime.time', '@messenger', '@ood_software.repo_member_apps', '@content_moderation.moderation_information', '@ood_software.repo_notifier', '@config.factory', '@logger.factory']
