ood_software.my_apps_redirect:
  path: '/appverse/my-apps'
  defaults:
    _controller: '\Drupal\ood_software\Controller\MyAppsRedirectController::redirectToMyApps'
    _title: 'My Apps'
  requirements:
    _role: 'authenticated'

ood_software.repo_resync:
  path: '/appverse/repo/{node}/resync'
  defaults:
    _controller: '\Drupal\ood_software\Controller\AppverseHubController::resync'
    _title: 'Re-sync Repo'
  options:
    parameters:
      node:
        type: entity:node
  requirements:
    _custom_access: '\Drupal\ood_software\Controller\AppverseHubController::ownerOrAdminAccess'
    _csrf_token: 'TRUE'
    _method: POST

ood_software.repo_toggle_publish:
  path: '/appverse/repo/{node}/unpublish'
  defaults:
    _controller: '\Drupal\ood_software\Controller\AppverseHubController::toggleRepoPublish'
    _title: 'Toggle Repo Publish'
  options:
    parameters:
      node:
        type: entity:node
  requirements:
    _custom_access: '\Drupal\ood_software\Controller\AppverseHubController::ownerOrAdminAccess'
    _csrf_token: 'TRUE'
    _method: POST

ood_software.app_toggle_publish:
  path: '/appverse/app/{node}/unpublish'
  defaults:
    _controller: '\Drupal\ood_software\Controller\AppverseHubController::toggleAppPublish'
    _title: 'Toggle App Publish'
  options:
    parameters:
      node:
        type: entity:node
  requirements:
    _custom_access: '\Drupal\ood_software\Controller\AppverseHubController::ownerOrAdminAccess'
    _csrf_token: 'TRUE'
    _method: POST

ood_software.user_my_apps_legacy_redirect:
  path: '/user/{user}/my-apps'
  defaults:
    _controller: '\Drupal\ood_software\Controller\AppverseHubController::redirectFromLegacy'
  requirements:
    _access: 'TRUE'

ood_software.manage_apps_redirect:
  path: '/appverse/manage-apps'
  defaults:
    _controller: '\Drupal\ood_software\Controller\AppverseHubController::redirectFromLegacyManageApps'
  requirements:
    _access: 'TRUE'

# --- Contributor-accessible transitions ---

ood_software.repo_send_for_review:
  path: '/appverse/repo/{node}/send-for-review'
  defaults:
    _controller: '\Drupal\ood_software\Controller\AppverseHubController::sendForReview'
  options:
    parameters:
      node:
        type: entity:node
  requirements:
    _custom_access: '\Drupal\ood_software\Controller\AppverseHubController::ownerOrAdminAccess'
    _csrf_token: 'TRUE'
    _method: POST

ood_software.app_send_for_review:
  path: '/appverse/app/{node}/send-for-review'
  defaults:
    _controller: '\Drupal\ood_software\Controller\AppverseHubController::sendForReview'
  options:
    parameters:
      node:
        type: entity:node
  requirements:
    _custom_access: '\Drupal\ood_software\Controller\AppverseHubController::ownerOrAdminAccess'
    _csrf_token: 'TRUE'
    _method: POST

# --- Admin-only transitions ---

ood_software.review_page:
  path: '/appverse/review/{node}'
  defaults:
    _form: '\Drupal\ood_software\Form\ReviewPageForm'
    _title_callback: '\Drupal\ood_software\Form\ReviewPageForm::title'
  options:
    parameters:
      node:
        type: entity:node
  requirements:
    _entity_access: 'node.view'
    node: \d+

ood_software.repo_assign_me:
  path: '/appverse/repo/{node}/assign-me'
  defaults:
    _controller: '\Drupal\ood_software\Controller\AppverseHubController::assignMe'
    _title: 'Assign to me'
  methods: [POST]
  options:
    parameters:
      node:
        type: entity:node
  requirements:
    _custom_access: '\Drupal\ood_software\Controller\AppverseHubController::adminOnlyAccess'
    _csrf_token: 'TRUE'
    _method: POST

ood_software.repo_run_review:
  path: '/appverse/repo/{node}/run-review'
  defaults:
    _controller: '\Drupal\ood_software\Controller\AppverseHubController::runReview'
    _title: 'Start review'
  methods: [POST]
  options:
    parameters:
      node:
        type: entity:node
  requirements:
    _custom_access: '\Drupal\ood_software\Controller\AppverseHubController::adminOnlyAccess'
    _csrf_token: 'TRUE'
    _method: POST

ood_software.repo_re_review:
  path: '/appverse/repo/{node}/re-review'
  defaults:
    _controller: '\Drupal\ood_software\Controller\AppverseHubController::reReview'
    _title: 'Re-review Repo'
  options:
    parameters:
      node:
        type: entity:node
  requirements:
    _custom_access: '\Drupal\ood_software\Controller\AppverseHubController::adminOnlyAccess'
    _csrf_token: 'TRUE'
    _method: POST

ood_software.repo_request_changes:
  path: '/appverse/repo/{node}/request-changes'
  defaults:
    _form: '\Drupal\ood_software\Form\AppverseHubRequestChangesForm'
    _title: 'Request changes'
  options:
    parameters:
      node:
        type: entity:node
  requirements:
    _custom_access: '\Drupal\ood_software\Controller\AppverseHubController::adminOnlyAccess'

ood_software.create_implementation_tag:
  path: '/appverse/app/{node}/create-implementation-tag'
  defaults:
    _form: '\Drupal\ood_software\Form\AppverseHubCreateTagForm'
    _title: 'Create implementation tag'
  options:
    parameters:
      node:
        type: entity:node
  requirements:
    _custom_access: '\Drupal\ood_software\Controller\AppverseHubController::adminOnlyAccess'

ood_software.repo_publish:
  path: '/appverse/repo/{node}/publish'
  defaults:
    _controller: '\Drupal\ood_software\Controller\AppverseHubController::adminPublish'
  options:
    parameters:
      node:
        type: entity:node
  requirements:
    _custom_access: '\Drupal\ood_software\Controller\AppverseHubController::adminOnlyAccess'
    _csrf_token: 'TRUE'
    _method: POST

ood_software.app_publish:
  path: '/appverse/app/{node}/publish'
  defaults:
    _controller: '\Drupal\ood_software\Controller\AppverseHubController::adminPublish'
  options:
    parameters:
      node:
        type: entity:node
  requirements:
    _custom_access: '\Drupal\ood_software\Controller\AppverseHubController::adminOnlyAccess'
    _csrf_token: 'TRUE'
    _method: POST

ood_software.repo_delete_confirm:
  path: '/appverse/repo/{node}/delete'
  defaults:
    _form: '\Drupal\ood_software\Form\AppverseHubDeleteForm'
    _title: 'Delete Repo'
  options:
    parameters:
      node:
        type: entity:node
  requirements:
    _custom_access: '\Drupal\ood_software\Controller\AppverseHubController::ownerOrAdminAccess'

ood_software.add_repo:
  path: '/appverse/add-repo'
  defaults:
    _form: '\Drupal\ood_software\Form\AddRepoForm'
    _title: 'Add an Appverse repo'
  requirements:
    _permission: 'submit appverse repo'

# Confirmation pages for the hub's Publish / Unpublish icons (the icons link
# here instead of POSTing). Each carries the access check of the action it
# confirms; confirming runs that action's controller method.
ood_software.repo_publish_confirm:
  path: '/appverse/repo/{node}/publish/confirm'
  defaults:
    _form: '\Drupal\ood_software\Form\HubPublishConfirmForm'
    _title: 'Publish'
    op: publish
  options:
    parameters:
      node:
        type: entity:node
  requirements:
    _custom_access: '\Drupal\ood_software\Controller\AppverseHubController::adminOnlyAccess'
ood_software.repo_unpublish_confirm:
  path: '/appverse/repo/{node}/unpublish/confirm'
  defaults:
    _form: '\Drupal\ood_software\Form\HubPublishConfirmForm'
    _title: 'Unpublish'
    op: unpublish
  options:
    parameters:
      node:
        type: entity:node
  requirements:
    _custom_access: '\Drupal\ood_software\Controller\AppverseHubController::ownerOrAdminAccess'
ood_software.app_toggle_publish_confirm:
  path: '/appverse/app/{node}/unpublish/confirm'
  defaults:
    _form: '\Drupal\ood_software\Form\HubPublishConfirmForm'
    _title: 'Publish or unpublish app'
    op: toggle_app
  options:
    parameters:
      node:
        type: entity:node
  requirements:
    _custom_access: '\Drupal\ood_software\Controller\AppverseHubController::ownerOrAdminAccess'

# The decision on the review page (appverse-planning#29): send it (it moves
# the repo and the review together), and, after an Accept with suggestions,
# publish the repo and the review. Reviewers only.
ood_software.review_decision:
  path: '/appverse/review/{node}/decision'
  defaults:
    _form: '\Drupal\ood_software\Form\ReviewDecisionConfirmForm'
    _title: 'Send decision'
  options:
    parameters:
      node:
        type: entity:node
  requirements:
    _permission: 'administer appverse content'
    node: \d+
ood_software.review_publish:
  path: '/appverse/review/{node}/publish'
  defaults:
    _form: '\Drupal\ood_software\Form\ReviewPublishConfirmForm'
    _title: 'Publish app and review'
  options:
    parameters:
      node:
        type: entity:node
  requirements:
    _permission: 'administer appverse content'
    node: \d+
