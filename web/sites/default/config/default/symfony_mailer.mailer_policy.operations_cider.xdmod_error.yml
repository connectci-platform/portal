      value: "<p>The scheduled job <strong>{{ job }}</strong> could not sync data from XDMoD.</p>\n<p>Key: {{ key }}<br>\nHTTP status: {{ status }}<br>\nError: {{ message }}</p>\n<p>{{ steps }}</p>\n<p>Resource pages keep showing the last good metrics, and hide them once they are 45 days old. This alert is sent at most once a day.</p>"
